[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast, isolated, single-function tests
    integration: tests that chain 2+ pipeline stages
    regression: tests pinned to specific entries in out/failure_reports.json
    e2e: full pipeline tests via process_statement/_process_page (OCR backend mocked)
addopts = -ra --strict-markers